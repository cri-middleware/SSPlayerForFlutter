name: 🛠️ Bug report / 不具合の報告
description: Something in the player behaves incorrectly. / プレイヤーの動作に問題がある場合。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Before filing, please [search existing issues](https://github.com/cri-middleware/SSPlayerForFlutter/issues?q=is%3Aissue).
        **Do not attach proprietary `.sspj` files here** — this is a public tracker. Ask through the
        [inquiry form](https://www.webtech.co.jp/contact/en.html) and we will arrange a private transfer.

        投稿前に既存の Issue を検索してください。**業務データの `.sspj` は公開の場である本 Issue に添付しないでください。** 送付が必要な場合はヘルプセンターをご利用ください。

  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 症状
      description: What you expected, and what you got instead. / 期待した挙動と、実際の挙動。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / 再現手順
      description: |
        The smallest sequence that shows the problem. A minimal `.ssab` helps a lot.
        問題を再現できる最小限の手順。最小限の `.ssab` があると助かります。
      placeholder: |
        1. Add SpriteStudioWidget to ...
        2. Load the .ssab
        3. Play "..."
        4. See ...
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package? / 対象パッケージ
      options:
        - ssplayer_flutter
        - ssplayer_flame
        - ssruntime_dart
        - ssconverter_dart
        - ssgen_dart
        - ssgen_flutter
        - Not sure / わからない
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version / パッケージのバージョン
      placeholder: 7.0.0-beta.1
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter / Dart version
      description: The output of `flutter --version`. / `flutter --version` の出力。
      placeholder: Flutter 3.47.5 / Dart 3.13.4
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms affected / 発生するプラットフォーム
      options:
        - label: iOS
        - label: Android
        - label: macOS
        - label: Windows
        - label: Linux
        - label: Web

  - type: textarea
    id: logs
    attributes:
      label: flutter run output / 実行ログ
      description: Any errors, warnings, or stack traces. / エラー・警告・スタックトレース。
      render: text

  - type: textarea
    id: other-players
    attributes:
      label: Does it reproduce on another SpriteStudio player? / 他の SpriteStudio Player でも再現しますか？
      description: |
        If it does, the cause is most likely the shared SpriteStudio runtime rather than this
        player, and saying so here saves a round trip.
        再現する場合は、この Player 固有ではなく共通ランタイム側の可能性が高いため、その旨をお書きください。
