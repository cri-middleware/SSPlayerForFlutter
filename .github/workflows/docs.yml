name: Docs

# Builds the site the way pages.yml publishes it, so a broken page surfaces
# before a release publishes it.
#
# A pull request that touches the site's sources runs this on its own, and
# builds the docs alone: the Web demos wait for ci.yml, which calls this for
# the weekly run and a dispatch. ci.yml cannot carry the pull-request half
# itself, because it ignores a change to Markdown alone, and the docs are
# almost nothing else.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs*.yml'
      - 'scripts/prepare-docs.*'
      - 'scripts/build-docs.*'
      - 'scripts/build-pages.*'
      - '.github/workflows/docs.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 📚 Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: ./scripts/prepare-docs.sh

      - name: Build the Pages tree (docs both locales + Web demo)
        env:
          DEMO: ${{ github.event_name == 'pull_request' && 'skip' || 'build' }}
          SDK: ${{ github.event_name == 'pull_request' && 'skip' || 'download' }}
        run: ./scripts/build-pages.sh prepare=no docs=yes "demo=$DEMO" "sdk=$SDK" "base=/${{ github.event.repository.name }}/" serve=no
