name: Publish docs via GitHub Pages

# Build the documentation site plus the two playable Web demos and deploy them to GitHub
# Pages via the artifact method (no gh-pages branch) — matching SSPlayerForGodot /
# SSPlayerForWeb / SSPlayerForRenPy.
#
# Everything the build job below does can be run locally with scripts/build-pages.sh —
# same script, same order, plus serve=yes to look at the result. Only the deploy job has
# no local equivalent.
#
# The published site is tied to releases, not to merges: a published release or a
# manual dispatch deploys, and nothing else does. This keeps the docs site in step
# with the release the SpriteStudio Docs portal links to, rather than running ahead
# of it on every merge. Every sibling player repository uses this same trigger pair.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege at the workflow level: the build job (which executes third-party
# code — pip install + zensical) only needs to read the repo.
# The Pages write + OIDC token are granted to the deploy job alone (below).
permissions:
  contents: read

# Never run two deploys at once; let an in-progress deploy finish rather than
# cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A Release deploys the site only when it becomes Latest
  # (scripts/release-channel.sh, read from the default branch): a pre-release
  # once its package has a full release, or a patch to an earlier line, leaves
  # the site as it is. A dispatch always deploys.
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.channel.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-tags: true
          persist-credentials: false
      - id: channel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          channel="$(./scripts/release-channel.sh "$TAG")"
          echo "::notice::${TAG} is a ${channel} release"
          if [ "$channel" = latest ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: channel
    if: needs.channel.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The submodule is for the demo, not the docs, and only for its test projects:
      # deploy-examples.sh converts SpriteStudio-SDK/tests/*.sspj into the .ssab the demo
      # plays. Nothing here compiles the submodule — the binaries come from its release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-

      # The only toolchain the demo adds to this job. No Rust: build-pages.sh runs with
      # sdk=download, so the wasm comes from the SpriteStudio-SDK release and the host
      # libraries deploy-examples.sh converts over dart:ffi are fetched from that same
      # release by each package's hook/build.dart. Same flutter-version pin as
      # release.yml — the demo should be built by the toolchain that ships the packages.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable

      # Both steps below run the same scripts a contributor runs locally, rather than
      # repeating the commands here, and so does docs.yml, which builds the docs on a
      # pull request. That build catches what this one would hit only while both run
      # the scripts — the fewer places the build is spelled out, the better.
      #
      # prepare-docs.sh creates .venv and installs the pins from docs/requirements.txt;
      # build-pages.sh then finds zensical there. (It falls back to PATH when there is no
      # venv, so a plain `pip install -r docs/requirements.txt` step would still work
      # here — but then CI and the README would be running different things.) It stays a
      # step of its own so a dependency failure is legible as one in the run summary,
      # which is also why build-pages.sh is invoked below with prepare=no.
      - name: Install dependencies
        run: ./scripts/prepare-docs.sh

      # scripts/build-pages.sh is the tree this job uploads: the documentation in both
      # locales, then the Flutter Web demo into site/demo. Running it here is what keeps
      # CI and the local build from drifting apart — the export is spelled out in the
      # script, not in this file, so a contributor can run exactly what a deploy runs.
      #
      # One build per locale - there is no plugin producing both from a single run any
      # more - English first, because the English build wipes site/ and the Japanese site
      # lives inside it at site/ja. build-docs.sh owns that order; the reason it exists is
      # that the opposite order silently publishes a site with no Japanese pages at all.
      # The demo lands after both, for the same reason: site/demo is inside site/.
      #
      # --strict fails the build on broken links / missing nav entries, so a publish
      # aborts rather than deploying a site with a dead link.
      #
      # base= is baked into the demo as --base-href, so it has to be the path this site is
      # served under; github.event.repository.name is that path for a project site, and
      # keeps a fork's Pages working without editing this file.
      #
      # Every option is spelled out rather than left to the script's defaults: they are
      # chosen for a working tree, and a publish should not change because one of them did.
      - name: Build the Pages tree (docs both locales + Web demo)
        run: ./scripts/build-pages.sh prepare=no docs=yes demo=build sdk=download "base=/${{ github.event.repository.name }}/" serve=no

      # site/ is the documentation and site/demo in one tree, which is what
      # build-pages.sh assembled above.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that writes to Pages / mints the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
