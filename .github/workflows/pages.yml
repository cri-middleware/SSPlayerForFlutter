name: Publish docs via GitHub Pages

# Build the MkDocs site and deploy it to GitHub Pages via the artifact method
# (no gh-pages branch) — matching SSPlayerForGodot / SSPlayerForWeb / SSPlayerForRenPy.
#
# The published site is tied to releases, not to merges: a published release and a
# manual dispatch deploy, while PRs only build with --strict to catch broken links /
# nav gaps. This keeps the docs site in step with the release the portal links to,
# rather than running ahead of it on every merge.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege at the workflow level: the build job (which runs on PRs and
# executes third-party code — pip install + mkdocs) only needs to read the repo.
# The Pages write + OIDC token are granted to the deploy job alone (below).
permissions:
  contents: read

# Serialize deploys per ref; cancel only superseded PR builds, never a main deploy.
concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      # Fail the build on broken links / missing nav entries so PRs catch it before merge.
      - name: Build docs (strict validation)
        run: mkdocs build --strict

      # Only the MkDocs output (site/) is served — no examples/demos to bundle.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes to Pages / mints the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
