name: Publish

# Fires when release.yml pushes a `<package>-v<version>` tag. pub.dev's automated
# publishing ONLY accepts publishes triggered by a git tag, so each package is
# gated on its own tag prefix. dart-lang's reusable workflow sets up BOTH Dart and
# Flutter, so it publishes our Flutter and pure-Dart packages alike. Before the
# first automated run, enable "Automated publishing" per package in the pub.dev
# Admin tab with tag pattern `<package>-v{{version}}`.
on:
  push:
    tags:
      - "ssruntime_dart-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssconverter_dart-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssgen_dart-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssgen_flutter-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssplayer_flutter-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssplayer_flame-v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  ssruntime_dart:
    if: startsWith(github.ref_name, 'ssruntime_dart-v')
    permissions:
      id-token: write # OIDC: mint a short-lived pub.dev credential (no stored secret)
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    with:
      working-directory: packages/ssruntime_dart

  ssconverter_dart:
    if: startsWith(github.ref_name, 'ssconverter_dart-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    with:
      working-directory: packages/ssconverter_dart

  ssgen_dart:
    if: startsWith(github.ref_name, 'ssgen_dart-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    with:
      working-directory: packages/ssgen_dart

  ssgen_flutter:
    if: startsWith(github.ref_name, 'ssgen_flutter-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    with:
      working-directory: packages/ssgen_flutter

  ssplayer_flutter:
    if: startsWith(github.ref_name, 'ssplayer_flutter-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    with:
      working-directory: packages/ssplayer_flutter

  ssplayer_flame:
    if: startsWith(github.ref_name, 'ssplayer_flame-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    with:
      working-directory: packages/ssplayer_flame
