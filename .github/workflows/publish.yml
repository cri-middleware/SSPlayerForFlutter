name: Publish

# Fires when release.yml pushes a `<package>-v<version>` tag. pub.dev's automated
# publishing ONLY accepts publishes triggered by a git tag, so each package is
# gated on its own tag prefix. dart-lang's reusable workflow sets up BOTH Dart and
# Flutter, so it publishes our Flutter and pure-Dart packages alike. Before the
# first automated run, enable "Automated publishing" per package in the pub.dev
# Admin tab with tag pattern `<package>-v{{version}}`.
on:
  push:
    tags:
      - "ssruntime_dart-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssconverter_dart-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssgen_dart-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssgen_flutter-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssplayer_flutter-v[0-9]+.[0-9]+.[0-9]+*"
      - "ssplayer_flame-v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # Which package the tag names, and whether it goes to pub.dev at all. A package
  # still carrying `publish_to: none` is tagged and released on GitHub alone:
  # `dart pub publish` would refuse it, so its job is skipped instead of failing.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.read.outputs.package }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: read
        run: |
          package="${GITHUB_REF_NAME%-v*}"
          if grep -Eq '^publish_to:[[:space:]]*none' "packages/${package}/pubspec.yaml"; then
            publish=false
            echo "::notice::${package} still carries publish_to: none — tagged, not published to pub.dev."
          else
            publish=true
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  ssruntime_dart:
    needs: gate
    if: needs.gate.outputs.package == 'ssruntime_dart' && needs.gate.outputs.publish == 'true'
    permissions:
      id-token: write # OIDC: mint a short-lived pub.dev credential (no stored secret)
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      working-directory: packages/ssruntime_dart

  ssconverter_dart:
    needs: gate
    if: needs.gate.outputs.package == 'ssconverter_dart' && needs.gate.outputs.publish == 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      working-directory: packages/ssconverter_dart

  ssgen_dart:
    needs: gate
    if: needs.gate.outputs.package == 'ssgen_dart' && needs.gate.outputs.publish == 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      working-directory: packages/ssgen_dart

  ssgen_flutter:
    needs: gate
    if: needs.gate.outputs.package == 'ssgen_flutter' && needs.gate.outputs.publish == 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      working-directory: packages/ssgen_flutter

  # The one package that does NOT go through the reusable workflow, and the
  # reason is assets/runtime-web/: the web Brain (the SDK's wasm-bindgen build of
  # libssruntime) is git-ignored build output that nevertheless has to be IN the
  # published archive -- assets/runtime-web/.pubignore is what re-includes it for
  # pub, but pub can only pack what is on disk. The reusable workflow takes
  # `environment` and `working-directory` and nothing else: there is no step
  # between its checkout and its `dart pub publish`. Publishing through it would
  # upload a package whose web loader (ssruntime_dart's web_runtime.dart) points
  # at three files that are not there -- and nothing would fail. The app builds;
  # the animation simply never starts.
  #
  # So this job is that workflow, step for step, with the download inserted. Keep
  # the two in sync when dart-lang change theirs.
  ssplayer_flutter:
    needs: gate
    if: needs.gate.outputs.package == 'ssplayer_flutter' && needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # OIDC: mint a short-lived pub.dev credential (no stored secret)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This is the step that provisions the OIDC credential pub.dev publishes
      # on. Its `dart` is then shadowed by the Flutter SDK's below, which is
      # fine and is what the reusable workflow does too -- the credential is in
      # the shared pub config, not in the binary.
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      # The reusable workflow installs an unpinned Flutter; this repository pins
      # one, and the package should be published by the toolchain release.yml
      # versioned it with and pages.yml built the demos with.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.50.0
          channel: stable

      # The workspace, not just this package: `resolution: workspace` means the
      # root pubspec is what resolves.
      - name: Install dependencies
        run: flutter pub get

      # The step the reusable workflow has no room for. Fetches the SDK release
      # that packages/ssruntime_dart/hook/build.dart pins -- the same one the
      # host libraries come from -- into packages/ssplayer_flutter/assets/runtime-web.
      # Also the same script scripts/build-pages.sh and scripts/build-release.sh
      # call, so what ships here is what a local build produced.
      - name: Fetch the web Brain
        run: ./scripts/download-web-runtime.sh

      # Same pair as the reusable workflow: validate, then upload. The dry run is
      # what turns a bad package into a failed job rather than a burnt version.
      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: packages/ssplayer_flutter

      - name: Publish to pub.dev
        run: dart pub publish -f
        working-directory: packages/ssplayer_flutter

  ssplayer_flame:
    needs: gate
    if: needs.gate.outputs.package == 'ssplayer_flame' && needs.gate.outputs.publish == 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      working-directory: packages/ssplayer_flame
