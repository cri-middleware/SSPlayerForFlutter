name: Release

# One release, dispatched by hand from main. A maintainer names the versions;
# everything after that is this workflow's, and the same ref with the same inputs
# always produces the same result:
#
#   versions   `<package>@<version>` pairs separated by spaces, <package> being
#              the directory under packages/. scripts/set-versions.dart writes
#              them, raises the other packages' constraints on them and turns
#              each package's `## [Unreleased]` notes into that version's
#              CHANGELOG.md section, and the commit reaches main only once
#              scripts/build-release.sh has passed. Empty sets nothing and
#              releases every current version that has no Release yet: the retry
#              after a run that died halfway.
#
#   dry_run    Set the versions and check everything, and commit, tag and release
#              nothing. The look before a release.
#
# Every package released gets a `<package>-v<version>` tag, which starts
# publish.yml -- pub.dev for a package without `publish_to: none`, nothing for one
# that still carries it -- and a DRAFT GitHub Release with a link to its
# CHANGELOG.md, which is where the notes are. A package whose Release already
# exists, draft or not, is skipped, so a re-run never doubles one. A maintainer
# publishes each draft, and publishing is what starts pages.yml.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Versions to set: <package>@<version>, space separated, <package> = directory under packages/. Empty releases the current versions.'
        type: string
        default: ''
      dry_run:
        description: 'Set the versions and check everything, but commit, tag and release nothing'
        type: boolean
        default: false

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Refuse to release from anywhere but main, even if dispatched on another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the version commit and the draft Releases
    steps:
      - name: Require RELEASE_PAT
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::error::a release pushes the version commit and the tags with RELEASE_PAT, and it is not set"
            exit 1
          fi

      # The only checkout that keeps its credentials: this job pushes the version
      # commit to main and the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags, so that a tag a run left behind is reused.
          fetch-depth: 0
          # IMPORTANT: a PAT (or GitHub App token), NOT the default GITHUB_TOKEN.
          # Tags pushed with GITHUB_TOKEN do NOT trigger other workflows, so
          # publish.yml would silently never run. A dry run pushes nothing and
          # falls back to it.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      # The same pin pages.yml builds the demos with and publish.yml publishes
      # with: a release should be checked by the toolchain that ships it.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable

      - name: Resolve workspace
        run: flutter pub get

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set the versions
        if: inputs.versions != ''
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          # One argument per pair, so the split is the point.
          # shellcheck disable=SC2086
          dart scripts/set-versions.dart $VERSIONS

      # A Release carries a link to its package's CHANGELOG.md and no notes of
      # its own, so a version without a section there would go out with nothing
      # to say. set-versions.dart writes the section for the versions it sets; a
      # run with `versions` empty releases what main already carries, and this is
      # where a version nobody wrote notes for stops, before anything is built.
      - name: Check the changelogs
        run: |
          set -euo pipefail
          status=0
          for pubspec in packages/*/pubspec.yaml; do
            dir="$(basename "$(dirname "$pubspec")")"
            version="$(sed -n 's/^version:[[:space:]]*//p' "$pubspec" | head -n 1)"
            if ! awk -v h="## [${version}] - " 'index($0, h) == 1 { found = 1 } END { exit !found }' "packages/${dir}/CHANGELOG.md" 2>/dev/null; then
              echo "::error::packages/${dir}/CHANGELOG.md has no '## [${version}]' section."
              status=1
            fi
          done
          exit "$status"

      # Everything that has to be true BEFORE a version is burnt: once a tag is
      # pushed, publish.yml runs `dart pub publish`, and a version on pub.dev is
      # permanent. scripts/build-release.sh is that check, against the versions
      # just set, and it is the same script a contributor runs in a working tree,
      # so CI and a local run cannot drift. Every option is spelled out rather
      # than left to the script's defaults: the defaults are chosen for a working
      # tree, and a release should not change because one of them did.
      #
      #   checks=analyze  the test suites need the Brain, which the build hooks
      #                   download from the pinned SDK release -- the same release
      #                   sdk=download is already asking about, below.
      #   codegen=skip    regenerating needs flatc and the C headers build-runtime.sh
      #                   copies out of the SDK submodule, neither of which is on
      #                   this runner. That one stays a local gate; the script says
      #                   so when it self-skips.
      #   sdk=download    fetches the web Brain into assets/runtime-web the same way
      #                   publish.yml's ssplayer_flutter job does, so the archive this
      #                   checks is the one that job would upload -- and checks that
      #                   the release packages/*/hook/build.dart pin carries the host
      #                   libraries too, or every consumer's `flutter pub get` 404s.
      #                   This is the step that fails while the SDK has not been
      #                   tagged yet, and that is the correct failure: there is
      #                   nothing to publish against.
      - name: Build & check the release
        run: ./scripts/build-release.sh out=release-dist packages=all checks=analyze codegen=skip sdk=download verify=yes clean=yes

      # Kept whether the step above passed or not: on a failure the per-package
      # dry-run reports are the whole diagnosis, and they are only in here.
      - name: Upload the release build
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: release-dist
          if-no-files-found: warn
          # A week, not the 90-day default: what lasts is on pub.dev, and this is
          # the run's report. Artifact storage is an org-wide quota, and a full one
          # does not degrade — `upload-artifact` fails, so the release build fails,
          # in a step that has nothing to do with the release.
          retention-days: 7

      # A main that moved during the run rejects this push, and nothing is tagged.
      - name: Commit the versions
        if: inputs.versions != '' && !inputs.dry_run
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          git add -u -- packages
          git commit -m "chore(release): $VERSIONS"
          git push origin HEAD:main

      - name: Tag and draft the Releases
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for pubspec in packages/*/pubspec.yaml; do
            dir="$(basename "$(dirname "$pubspec")")"
            version="$(sed -n 's/^version:[[:space:]]*//p' "$pubspec" | head -n 1)"
            tag="${dir}-v${version}"
            if gh release view "$tag" > /dev/null 2>&1; then
              continue
            fi
            # A run that tagged and then died left the tag behind; it is reused.
            if ! git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              git tag -a "$tag" -m "$tag" "$sha"
              git push origin "refs/tags/${tag}"
            fi
            notes="See [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${tag}/packages/${dir}/CHANGELOG.md) for what changed."
            args=(--verify-tag --title "${dir} ${version}" --notes "$notes" --draft)
            channel="$(./scripts/release-channel.sh "$tag")"
            [ "$channel" != prerelease ] || args+=(--prerelease)
            gh release create "$tag" "${args[@]}"
            echo "::notice::Drafted ${tag} — check it and publish it from the Releases page."
          done
