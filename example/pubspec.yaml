name: ssplayer_flutter_example
description: Example app for ssplayer_flutter — plays tests/overall/overall.ssab.
publish_to: none
version: 0.1.0-dev.1

# Part of the repo-root pub workspace (see ../pubspec.yaml).
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  desktop_drop: ^0.7.1
  flutter:
    sdk: flutter
  ssplayer_flutter:
    path: ../packages/ssplayer_flutter
  # Desktop dev live-reload: reassemble() calls SsProjectSync to reconvert stale
  # SpriteStudio_Source projects via the host libssconverter (desktop/debug
  # only). Kept out of ssplayer_flutter so the runtime stays converter-free.
  ssgen_dart:
    path: ../packages/ssgen_dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Populated by `scripts/prepare-example-assets.sh` (stages SpriteStudio_Source/
    # then converts it here — the SsProjectSync convention the live-reload reuses).
    - assets/spritestudio/overall/
