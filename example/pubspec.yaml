name: ssplayer_flutter_example
description: Example app for ssplayer_flutter — plays tests/overall/overall.ssab.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.6"

dependencies:
  desktop_drop: ^0.7.1
  flutter:
    sdk: flutter
  ssplayer_flutter:
    path: ../packages/ssplayer_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Populate with `scripts/prepare-example-assets.sh` (converts overall.sspj).
    - assets/overall/
