name: ssplayer_flutter_example
description: Example app for ssplayer_flutter — plays tests/overall/overall.ssab.
publish_to: none
version: 0.1.0-dev.1

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  desktop_drop: ^0.7.1
  flutter:
    sdk: flutter
  ssplayer_flutter:
    path: ../../packages/ssplayer_flutter
  # Dev live-reload: the SsLiveReload mixin rides hot reload (desktop reconvert
  # in-process, device reload-only) + `dart run ssgen_flutter:ssreconvert` host
  # runner. Kept out of ssplayer_flutter so the runtime stays converter-free.
  ssgen_flutter:
    path: ../../packages/ssgen_flutter
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Populated by `scripts/deploy-examples.sh` (stages SpriteStudio_Source/
    # then converts it here — the SsProjectSync convention the live-reload reuses).
    # One dir per deployed project; the stem matches its .sspj (see deploy script).
    # NB: a Flutter asset dir entry is NOT recursive, so every subdirectory the
    # converter emits (font/, sound/ for reference textures/fonts/sounds) needs
    # its own line. Ringo has no subdirs.
    - assets/spritestudio/overall/
    - assets/spritestudio/overall/font/
    - assets/spritestudio/overall/sound/
    - assets/spritestudio/Ringo/
