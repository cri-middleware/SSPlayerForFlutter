INHERIT: ./mkdocs.base.yml

docs_dir: docs/ja
site_dir: site/ja
site_url: "https://cri-middleware.github.io/SSPlayerForFlutter/ja/"
site_description: "SpriteStudio のアニメーション（.ssab）を Flutter でそのまま再生します"

theme:
  language: ja

extra:
  site_root_prefix: "../"
  social:
    - icon: material/motion-play
      link: https://cri-middleware.github.io/SpriteStudio-Docs/ja/
      name: SpriteStudio Docs（ポータル）
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: GitHub の cri-middleware
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: SpriteStudio
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: X の SpriteStudio

nav:
  - 🏠 ホーム: index.md
  - 🚀 セットアップ:
      - インストール: guide/install.md
  - 🎬 ワークフロー:
      - クイックスタート: guide/quickstart.md
      - 再生とイベント: guide/playback.md
      - モーションブレンド: guide/motion-blending.md
      - パーツトラッキング: guide/part-following.md
      - パーツオーバーライド: guide/part-overrides.md
      - テクスチャ差し替え: guide/textures.md
      - Flame 連携: guide/flame.md
      - アセットの準備（.sspj → .ssab）: guide/conversion.md
      - ライブリロード: guide/live-reload.md
  - 📖 API リファレンス: api.md
  - ⚠️ 制約と適用範囲: limitations.md
  - 🛠️ Player・SDK 開発者向けガイド:
      - ビルドガイド: development/build.md
      - プレイヤーの構成: development/architecture.md
      - ネイティブランタイム: development/native-runtime.md
  - 📦 パッケージ: packages.md
  - ⚖️ ライセンス:
      - ライセンス: license/index.md
      - サードパーティ通知: license/third-party.md
