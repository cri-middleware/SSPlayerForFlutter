INHERIT: ./mkdocs.base.yml

docs_dir: docs/ja
site_dir: site/ja
site_url: "https://cri-middleware.github.io/SSPlayerForFlutter/ja/"
site_description: "SpriteStudio のアニメーション（.ssab）を Flutter でそのまま再生します"

theme:
  language: ja

extra:
  site_root_prefix: "../"
  social:
    - icon: material/motion-play
      link: https://cri-middleware.github.io/SpriteStudio-Docs/ja/
      name: SpriteStudio Docs（ポータル）
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: GitHub の cri-middleware
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: SpriteStudio
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: X の SpriteStudio

plugins:
  - search
  - redirects
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        コード中心の Flutter 用プレイヤーです。`SpriteStudioAnimation` ウィジェットが、アプリの実行前に `.sspj` から作った `.ssab` を再生します。クラス単位の API リファレンスは `dart doc` が生成するもので、このファイルには含まれません。pub.dev がパッケージごとに公開しています。
      sections:
        プレイヤーの使い方:
          - index.md: "このプレイヤーの概要、主な機能、対応プラットフォーム、`.sspj` から画面に表示されるまでのデータの流れ、サンプルアプリ、ブラウザで動くライブデモ、関連リポジトリ。"
          - guide/install.md: "アプリへの導入。必要な Flutter / Dart と SpriteStudio のバージョン、対応プラットフォーム、`ssplayer_flutter` と `ssconverter_dart` の追加、Flame とライブリロードに必要な追加パッケージ、Web での `loadSsRuntime()`。"
          - guide/quickstart.md: "`ssconvert` で `.sspj` を `assets/spritestudio/` に変換し、そのフォルダを `pubspec.yaml` に宣言して、`SpriteStudioAnimation.asset` で `.ssab` を再生するまで。主な引数（`animation`・`width` / `height`・`loopCount`・`playing`）と、web での `loadSsRuntime()`。"
          - guide/playback.md: "`SpriteStudioAnimation` のすべての引数（`transition`・`fit`・`placeholder`・`onLoaded`・`onError`・イベントコールバック・`children`・`backend` など）、`SpriteStudioView` でプレイヤーを自分で持つ方法、`SpriteStudioPlayer` の再生制御。`play`・`pause`・`stop`・`seek`、`loopCount`・`speedScale`、逆再生と往復再生、フレームやラベルで区切る部分再生、`flipX`・`flipY`・`offset`・`scale`、アニメの切り替え、クロックの駆動、`onUserData`・`onSignal`・`onAudio` とアニメ終了のイベント。"
          - guide/motion-blending.md: "1 体のキャラクターで複数のアニメを同時に再生する方法。トラックの積み重ね、`SsTrackBlend` の mix と additive によるオーバーレイ、`crossfade` と `fadeTrack`、1 つのトラックに重み付きで載せる複数のアニメ、`SsTrackSync`、トラックごとの速度とループ回数、`setTrackFrame` によるスクラブ、イベントを発火するトラック。"
          - guide/part-following.md: "`SpriteStudioPartAnchor` でウィジェットをパーツに追従させる方法（位置・回転・スケール、hide フレームと反転時の挙動）。`partTransform` で姿勢、`partQuad` で輪郭を読み、`hitTestPart` で点の下にあるパーツを調べること、スキンメッシュのパーツに直接追従できない理由、Flame からの追従。"
          - guide/part-overrides.md: "`setPartColorOverride`・`setPartCellOverride`・`setPartVisibilityOverride` で、パーツの色・セル・表示をコードから強制する方法。`SsBlendOp`、`SsOverridePriority`、`ByIndex` 形式、先にアニメを選択しておく理由。"
          - guide/buttons.md: "Flutter のボタンの中に置いたアニメでボタンの状態を見せる方法。`WidgetStatesController` と `SpriteStudioStateView`、`normal`・`hover`・`pressed`・`disabled`・`focused` のラベル、`clips`、Reduced motion、絵の上だけでポインタを受ける `SpriteStudioHitRegion`、`semanticLabel`、普通のボタンに重ねるエフェクト。"
          - guide/textures.md: "セルマップのテクスチャを実行時に丸ごと差し替えて、衣装替え・カラーバリエーション・表情差分に使う方法。`setCellmapTexture`、`replaceableTextureNames`、TextureChange のファイル名、画像の所有者、同じサイズのアトラスが要ること、セルオーバーライドとの使い分け。"
          - guide/flame.md: "`FlameGame` で `ssplayer_flame` を使う方法。`SpriteStudioComponent` とそのコンストラクタ引数、`hitParts` を持つ `SpriteStudioButtonComponent`、`component.player` での再生制御、読み込み失敗の扱い、`onDispose` での解放。"
          - guide/conversion.md: "`.sspj` から `.ssab` を作る方法。参照テクスチャ形式と embedded の違い、変換ルート（`ssconvert`・ライブリロード・ssconverter-web・SSConverter GUI・`ssconverter-cli`）のコマンド、出力を `assets/` と `pubspec.yaml` に配置する手順。"
          - guide/live-reload.md: "保存するたびに、実行中のアプリを再変換して更新する仕組み。`ssgen_flutter` の `sswatch`、`SS_LIVE_RELOAD` define、`--run` と IDE からの起動、`--device` で送る中身、`SsLiveReload` mixin、macOS の App Sandbox、動作するプラットフォームとビルドモード。"
          - api.md: "生成されるクラス単位の API リファレンスの置き場（pub.dev と、手元での `dart doc`）と、クラス名ごとの入口。`SpriteStudioAnimation`・`SpriteStudioPlayer`・`SpriteStudioView`・`SpriteStudioPartAnchor`・`SpriteStudioStateView`・`TextureRegistry`・`SsConverter` など。"
          - limitations.md: "描画されないもの（テキストパーツ・9 スライスパーツ）、プラットフォームと Web プレビューの制約、描画バックエンドごとの合成モードの再現度、アニメ 1 つで同時に使えるマスクの上限、パーツトラッキングの制約、再生機能の制約（シークとイベント、逆再生のオーディオ、`independent` なインスタンスパーツ）。"
          - packages.md: "このリポジトリがリリースするパッケージとそれぞれの用途。多くのアプリが依存する `ssplayer_flutter` から、コンバータとライブリロードのツールまで。Web のライブデモへのリンク。"
        Player・SDK 開発者向けガイド:
          - development/build.md: "プレイヤーをソースからビルドする手順。前提ツール、`scripts/build-runtime.sh`、Web の wasm ランタイム、ffigen と FlatBuffers のコードの再生成、パッケージごとのテスト、変更したプレイヤーを `dependency_overrides` でアプリに使う方法、テストでは確かめられないこと。"
          - development/architecture.md: "FFI バインディングからウィジェット・Flame アダプタまでのレイヤー、`SpriteStudioInternalPlayer` の直接利用、ライブリロードのデータの流れ、描画バックエンドと `DrawBatch` の振り分け、パーツの姿勢と反転をこう扱っている理由。"
          - development/native-runtime.md: "ネイティブライブラリがアプリに届く仕組み。Native Assets と `hook/build.dart`、解決順、`hooks.user_defines` で差し込む自前の dylib、プラットフォームごとの同梱、純 Dart からの `ssruntime_dart` の利用。"
        ライセンス:
          - license/index.md: "BSD-3-Clause ライセンス。全文と日本語参考訳の場所、同梱する `libssruntime` と `libssconverter` が SDK の条項に従うこと。"
          - license/third-party.md: "サードパーティコンポーネント（SDK の Rust クレート、FlatBuffers、Dart / Flutter パッケージ）、ネイティブライブラリのライセンス通知の場所、アプリを再頒布するときに同梱するもの。"

