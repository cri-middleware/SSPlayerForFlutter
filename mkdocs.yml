site_name: SpriteStudioPlayer for Flutter
site_description: "Play OPTPiX SpriteStudio 7 animations (.ssab) natively in Flutter"
site_author: "CRI Middleware Co., Ltd."
site_url: "https://cri-middleware.github.io/SSPlayerForFlutter/"
repo_name: "cri-middleware/SSPlayerForFlutter"
repo_url: "https://github.com/cri-middleware/SSPlayerForFlutter"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - callouts
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true

# Task-oriented navigation modeled on the sibling players (Godot / Ren'Py):
# Setup → Workflow → API Reference → Limitations. The monorepo/runtime internals
# live under "For Contributors" — Flutter is a multi-package library, not a single
# plugin, so it keeps that one contributor-facing section the siblings don't need.
nav:
  - Home: index.md
  - Setup:
      - Installation: guide/install.md
      - Build Guide: contributing/build.md
  - Workflow:
      - Quick Start: guide/quickstart.md
      - Playback & Events: guide/playback.md
      - Part Following: guide/part-following.md
      - Part Overrides: guide/part-overrides.md
      - Flame Integration: guide/flame.md
      - Preparing Assets (.sspj → .ssab): guide/conversion.md
      - Live Reload: guide/live-reload.md
  - API Reference: api.md
  - Limitations & Scope: limitations.md
  - For Contributors:
      - Architecture: contributing/architecture.md
      - Native Runtime: contributing/native-runtime.md
      - Releasing: contributing/releasing.md
  - Packages: packages.md
  - License:
      - License: license/index.md
      - Third-Party Notices: license/third-party.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  alternate:
    - name: English
      link: ./
      lang: en
    - name: 日本語
      link: ./ja/
      lang: ja
