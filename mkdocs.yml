INHERIT: ./mkdocs.base.yml

docs_dir: docs/en
site_dir: site
site_url: "https://cri-middleware.github.io/SSPlayerForFlutter/"
site_description: "Play SpriteStudio animations (.ssab) natively in Flutter"

theme:
  language: en

extra:
  site_root_prefix: ""
  social:
    - icon: material/motion-play
      link: https://cri-middleware.github.io/SpriteStudio-Docs/
      name: SpriteStudio Docs
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: cri-middleware on GitHub
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: SpriteStudio
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: SpriteStudio on X

plugins:
  - search
  - redirects
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Flutter player, code-first: the `SpriteStudioAnimation` widget plays an `.ssab`, which is
        built from a `.sspj` before the app runs. The class-level API reference is generated by
        `dart doc` and is not part of this file; pub.dev publishes it for each package.
      sections:
        Using the Player:
          - index.md: "What the player is, with its key features, the platforms it runs on, how data flows from `.sspj` to the screen, the sample apps, the live Web demos, and related repositories."
          - guide/install.md: "Adding the player to an app: the Flutter / Dart and SpriteStudio version floors, supported platforms, `flutter pub add ssplayer_flutter` and `ssconverter_dart`, the extra packages for Flame and live reload, and `loadSsRuntime()` on the web."
          - guide/quickstart.md: "Converting a `.sspj` with `ssconvert` into `assets/spritestudio/`, declaring the folder in `pubspec.yaml`, playing the `.ssab` with `SpriteStudioAnimation.asset` and its main parameters (`animation`, `width` / `height`, `loopCount`, `playing`), and `loadSsRuntime()` on the web."
          - guide/playback.md: "Every `SpriteStudioAnimation` parameter (`transition`, `fit`, `placeholder`, `onLoaded`, `onError`, event callbacks, `children`, `backend` and the rest), owning the player yourself with `SpriteStudioView`, and controlling a `SpriteStudioPlayer`: `play`, `pause`, `stop`, `seek`, `loopCount`, `speedScale`, backward and ping-pong playback, playing a section by frame or label, `flipX` / `flipY` / `offset` / `scale`, switching animations, driving the clock, and the `onUserData`, `onSignal`, `onAudio` and animation-finished events."
          - guide/motion-blending.md: "Playing several animations on one character at once: the track stack, overlays with `SsTrackBlend` mix and additive, `crossfade` and `fadeTrack`, weighted sources on one track, `SsTrackSync`, per-track speed and loop count, scrubbing a track with `setTrackFrame`, and which track fires events."
          - guide/part-following.md: "Pinning a widget to a part with `SpriteStudioPartAnchor` (position, rotation, scale, hidden and mirrored behaviour), reading a pose with `partTransform`, an outline with `partQuad` and a hit with `hitTestPart`, why a skinned mesh part cannot be followed directly, and following from Flame."
          - guide/part-overrides.md: "Forcing a part's colour, cell or visibility from code with `setPartColorOverride`, `setPartCellOverride` and `setPartVisibilityOverride`: `SsBlendOp`, `SsOverridePriority`, the `ByIndex` forms, and why to select the animation first."
          - guide/buttons.md: "An animation inside a Flutter button: `SpriteStudioStateView` with a `WidgetStatesController`, the `normal`, `hover`, `pressed`, `disabled` and `focused` labels, `clips`, reduced motion, `SpriteStudioHitRegion` for pointers on the artwork only, `semanticLabel`, and laying an effect over an ordinary button."
          - guide/textures.md: "Swapping a whole cellmap's texture at runtime for outfits, colour variants and expressions: `setCellmapTexture`, `replaceableTextureNames`, TextureChange file names, who owns the image, the same-size atlas rule, and when to use a cell override instead."
          - guide/flame.md: "`ssplayer_flame` for a `FlameGame`: `SpriteStudioComponent` and its options, `SpriteStudioButtonComponent` with `hitParts`, reaching the player through `component.player`, load errors, and releasing the component in `onDispose`."
          - guide/conversion.md: "Building an `.ssab` from a `.sspj`: reference versus embedded textures, the conversion routes (`ssconvert`, Live Reload, ssconverter-web, SSConverter GUI, `ssconverter-cli`) with their commands, and copying the result into `assets/` and `pubspec.yaml`."
          - guide/live-reload.md: "Reconverting on save while the app runs: `sswatch` from `ssgen_flutter`, the `SS_LIVE_RELOAD` define, launching with `--run` or from an IDE, the `--device` payload, the `SsLiveReload` mixin, the macOS App Sandbox, and which platforms and build modes work."
          - api.md: "Where the generated class-level API reference lives (pub.dev, or `dart doc` locally) and the entry points by class name, such as `SpriteStudioAnimation`, `SpriteStudioPlayer`, `SpriteStudioView`, `SpriteStudioPartAnchor`, `SpriteStudioStateView`, `TextureRegistry` and `SsConverter`."
          - limitations.md: "What is not drawn (Text and 9-slice parts), platform and Web preview limits, the render backends and blend-mode fidelity, the cap on masks per animation, part following limits, and playback constraints: seeking and events, reverse audio, `independent` instance parts."
          - packages.md: "The packages this repository releases and what each is for, from `ssplayer_flutter`, the one most apps depend on, to the converter and live-reload tooling, with the live Web demos."
        For Player & SDK Developers:
          - development/build.md: "Building the player from source: prerequisites, `scripts/build-runtime.sh`, the web wasm runtime, regenerating ffigen and FlatBuffers code, the test suite of each package, using a changed player in an app with `dependency_overrides`, and the checks the suites miss."
          - development/architecture.md: "The layers from the FFI bindings to the widgets and the Flame adapter, driving `SpriteStudioInternalPlayer` directly, the live reload data flow, the render backends and `DrawBatch` dispatch, and why part poses and flips are handled as they are."
          - development/native-runtime.md: "How the native library reaches the app: native assets and `hook/build.dart`, the resolution order, bringing your own dylib with `hooks.user_defines`, packaging per platform, and using `ssruntime_dart` from plain Dart."
        License:
          - license/index.md: "The BSD-3-Clause license: where the full text and its Japanese reference translation are, and that the bundled `libssruntime` and `libssconverter` follow the SDK's terms."
          - license/third-party.md: "Third-party components (the SDK's Rust crates, FlatBuffers, the Dart / Flutter packages), where the native libraries' license notices are, and what to include when redistributing an app."

