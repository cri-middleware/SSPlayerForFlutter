# English site -- the default locale, so it builds to the site root and keeps the plain
# `mkdocs.yml` name that the tooling looks for when no `-f` is given.
#
# Everything not listed here comes from mkdocs.base.yml. Before adding anything, read the
# note there about sequences: `nav` and `extra.social` are defined in this file and in
# mkdocs.ja.yml, and must never also appear in the base.
INHERIT: ./mkdocs.base.yml

docs_dir: docs/en
site_dir: site
site_url: "https://cri-middleware.github.io/SSPlayerForFlutter/"
site_description: "Play SpriteStudio animations (.ssab) natively in Flutter"

theme:
  # Drives the UI string translations and the `html lang` attribute.
  language: en

extra:
  # English builds to the site root, so the root of the whole multi-locale site is right
  # here. The language selector prepends this to its target; see
  # overrides/partials/alternate.html.
  site_root_prefix: ""
  # Footer icons. Keep to destinations that outlive any single release. Mirrored, with
  # translated labels, in mkdocs.ja.yml - add or reorder an icon in both files.
  social:
    # The family entry point. Every sibling site carries this as its first footer icon, so a
    # reader who arrives here from a search can reach the portal and the other players.
    - icon: material/motion-play
      link: https://cri-middleware.github.io/SpriteStudio-Docs/
      name: SpriteStudio Docs
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: cri-middleware on GitHub
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: SpriteStudio
    # Keep the handle here in sync with `twitter:site` in overrides/main.html.
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: SpriteStudio on X

# Task-oriented navigation modeled on the sibling players (Godot / Ren'Py):
# Setup → Workflow → API Reference → Limitations. The monorepo/runtime internals live under
# "For Contributors" — Flutter is a multi-package library, not a single plugin, so it keeps
# that one contributor-facing section the siblings don't need.
#
# Paths are locale-relative and identical to the ones in mkdocs.ja.yml; only the labels
# differ. When you add, move, or rename a page, edit both files.
nav:
  - 🏠 Home: index.md
  - 🚀 Setup:
      - Installation: guide/install.md
      - Build Guide: contributing/build.md
  - 🎬 Workflow:
      - Quick Start: guide/quickstart.md
      - Playback & Events: guide/playback.md
      - Part Following: guide/part-following.md
      - Part Overrides: guide/part-overrides.md
      - Texture Replacement: guide/textures.md
      - Flame Integration: guide/flame.md
      - Preparing Assets (.sspj → .ssab): guide/conversion.md
      - Live Reload: guide/live-reload.md
  - 📖 API Reference: api.md
  - ⚠️ Limitations & Scope: limitations.md
  - 🛠️ For Contributors:
      - Architecture: contributing/architecture.md
      - Native Runtime: contributing/native-runtime.md
      - Releasing: contributing/releasing.md
  - 📦 Packages: packages.md
  - ⚖️ License:
      - License: license/index.md
      - Third-Party Notices: license/third-party.md
