site_name: SpriteStudioPlayer for Flutter
site_description: "Play OPTPiX SpriteStudio 7 animations (.ssab) natively in Flutter"
site_author: "CRI Middleware Co., Ltd."
site_url: "https://cri-middleware.github.io/SSPlayerForFlutter/"
repo_name: "cri-middleware/SSPlayerForFlutter"
repo_url: "https://github.com/cri-middleware/SSPlayerForFlutter"
# No `edit_uri`, so Material renders no "edit this page" button. This repo's value was
# correct (`edit/main/docs/`, matching its default branch), but it is a branch name nothing
# validates -- `--strict` does not look at it -- and it had already drifted wrong in three of
# the five player repos. Dropped everywhere rather than kept correct in some and stale in
# others; the footer repo link and CONTRIBUTING.md already route corrections.
# Rendered in the site footer. Deliberately year-less so it never goes stale.
copyright: "Copyright &copy; CRI Middleware Co., Ltd."

# Nothing builds the docs on a pull request - pages.yml runs on `release: published` and
# dispatch - so the local build is the only gate, and a plain `build`/`serve` should fail on
# a broken link too rather than depend on remembering `--strict`.
strict: true

theme:
  name: material
  language: en
  # Only overrides/main.html lives here: it appends the Open Graph / Twitter Card metadata
  # that Material does not emit on its own.
  custom_dir: overrides
  # Matches this player's card on the SpriteStudio-Docs landing page. A bundled Material
  # icon, so it needs no image file; there is no SpriteStudio artwork for a favicon yet.
  icon:
    logo: simple/flutter
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    # Previous / next links in the footer, so the guides can be read in order.
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - callouts
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          # Feeds <meta name="description"> and the Open Graph tags on every ja page;
          # without it they inherit the top-level English site_description.
          site_description: "SpriteStudio 7 のアニメーション（.ssab）を Flutter でそのまま再生するプラグイン"
          extra:
            # Footer icon labels (title / aria-label). Mirrors the `extra.social` list below.
            social:
              - icon: fontawesome/brands/github
                link: https://github.com/cri-middleware
                name: GitHub の cri-middleware
              - icon: material/web
                link: https://www.webtech.co.jp/spritestudio/
                name: OPTPiX SpriteStudio
              - icon: fontawesome/brands/x-twitter
                link: https://x.com/spritestudio
                name: X の SpriteStudio
          # Japanese nav labels. Keys must match the `nav:` titles below *exactly*,
          # emoji included - a mismatched key silently leaves the English label.
          nav_translations:
            🏠 Home: 🏠 ホーム
            🚀 Setup: 🚀 セットアップ
            Installation: インストール
            Build Guide: ビルドガイド
            🎬 Workflow: 🎬 ワークフロー
            Quick Start: クイックスタート
            Playback & Events: 再生とイベント
            Part Following: パーツトラッキング
            Part Overrides: パーツオーバーライド
            Flame Integration: Flame 連携
            Preparing Assets (.sspj → .ssab): アセットの準備（.sspj → .ssab）
            Live Reload: ライブリロード
            📖 API Reference: 📖 API リファレンス
            ⚠️ Limitations & Scope: ⚠️ 制約と適用範囲
            🛠️ For Contributors: 🛠️ コントリビューター向け
            Architecture: アーキテクチャ
            Native Runtime: ネイティブランタイム
            Releasing: リリース
            📦 Packages: 📦 パッケージ
            ⚖️ License: ⚖️ ライセンス
            License: ライセンス
            Third-Party Notices: サードパーティ通知

# Task-oriented navigation modeled on the sibling players (Godot / Ren'Py):
# Setup → Workflow → API Reference → Limitations. The monorepo/runtime internals
# live under "For Contributors" — Flutter is a multi-package library, not a single
# plugin, so it keeps that one contributor-facing section the siblings don't need.
nav:
  - 🏠 Home: index.md
  - 🚀 Setup:
      - Installation: guide/install.md
      - Build Guide: contributing/build.md
  - 🎬 Workflow:
      - Quick Start: guide/quickstart.md
      - Playback & Events: guide/playback.md
      - Part Following: guide/part-following.md
      - Part Overrides: guide/part-overrides.md
      - Flame Integration: guide/flame.md
      - Preparing Assets (.sspj → .ssab): guide/conversion.md
      - Live Reload: guide/live-reload.md
  - 📖 API Reference: api.md
  - ⚠️ Limitations & Scope: limitations.md
  - 🛠️ For Contributors:
      - Architecture: contributing/architecture.md
      - Native Runtime: contributing/native-runtime.md
      - Releasing: contributing/releasing.md
  - 📦 Packages: packages.md
  - ⚖️ License:
      - License: license/index.md
      - Third-Party Notices: license/third-party.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  # Footer icons. Keep to destinations that outlive any single release.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: cri-middleware on GitHub
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: OPTPiX SpriteStudio
    # Keep the handle here in sync with `twitter:site` in overrides/main.html.
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: SpriteStudio on X
  alternate:
    - name: English
      link: ./
      lang: en
    - name: 日本語
      link: ./ja/
      lang: ja
