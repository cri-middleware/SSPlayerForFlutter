# ffigen configuration: generates the low-level dart:ffi bindings for the
# SpriteStudio-SDK converter (libssconverter) from the C-API header the SDK
# build.rs emits (native/include/ssconverter.h, copied in by build-runtime /
# download-sdk). No cbindgen here.
#
# Regenerate with:  scripts/generate-ffigen-code.sh  (globs packages/*/ffigen*.yaml;
# also invoked by build-runtime / download-sdk). The output is gitignored.
name: SsConverterBindings
description: Low-level dart:ffi bindings for the SpriteStudio-SDK converter (libssconverter).
output: "lib/src/ssconverter_bindings.g.dart"
# Native assets: generate top-level `@Native(assetId: ...)` functions that resolve
# the code asset bundled by hook/build.dart. Must match CodeAsset(name: 'ssconverter').
ffi-native:
  asset-id: "package:ssconverter_dart/ssconverter"
headers:
  entry-points:
    - "native/include/ssconverter.h"
  include-directives:
    - "native/include/ssconverter.h"
functions:
  include:
    - "ss_converter_.*"
structs:
  include:
    - "Context"
enums:
  include:
    - "CConverterError"
typedefs:
  include:
    - "LogCallback"
comments:
  style: any
  length: full
preamble: |
  // GENERATED by ffigen (scripts/generate-ffigen-code.sh). Do not edit by hand.
  // ignore_for_file: type=lint, unused_field, unused_element, camel_case_types, non_constant_identifier_names
