name: ssconverter_dart
description: >-
  Host-side SpriteStudio converter for the Flutter ecosystem. A dart:ffi CLI +
  library over the SpriteStudio-SDK "ssconverter" that turns .sspj projects into
  optimized .ssab binaries (optionally self-contained / embedded). Desktop only
  (Windows / macOS / Linux); pure Dart, no Flutter dependency — the companion of
  the ssplayer_flutter runtime.
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
publish_to: none # not yet published to pub.dev

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

# Host CLI: `dart run ssconverter_dart:ssconvert <sspj>` (.sspj → .ssab).
executables:
  ssconvert:

environment:
  # Native assets (build hooks) are stable since Dart 3.10 (the hooks/code_assets
  # floor too) — target that for the widest consumer base.
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  ffi: ^2.2.0
  args: ^2.7.0
  hooks: ^2.2.0
  code_assets: ^2.1.0
  archive: ^4.3.0
  crypto: ^3.0.7

dev_dependencies:
  test: ^1.31.0
  lints: ^6.1.0
  ffigen: ^22.0.0
