name: ssconverter_dart
description: >-
  Converts SpriteStudio projects (.sspj) into .ssab from Dart: a CLI and
  library over the SpriteStudio converter, for desktop hosts (Windows, macOS,
  Linux).
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
topics:
  - spritestudio
  - converter
  - cli
  - ffi
  - animation

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

# Host CLI: `dart run ssconverter_dart:ssconvert <sspj>` (.sspj → .ssab).
executables:
  ssconvert:

environment:
  # Native assets (build hooks) are stable since Dart 3.10 (the hooks/code_assets
  # floor too) — target that for the widest consumer base.
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  ffi: ^2.2.0
  args: ^2.7.0
  hooks: ^2.2.0
  code_assets: ^2.1.0
  archive: ^4.5.2
  crypto: ^3.0.8

dev_dependencies:
  test: ^1.31.1
  lints: ^6.1.0
  ffigen: ^23.0.0
