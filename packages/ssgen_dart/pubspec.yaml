name: ssgen_dart
description: >-
  Reconverts only the SpriteStudio projects in a folder that changed, over
  ssconverter_dart: the library behind live reload. Desktop hosts, pure Dart.
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  ssconverter_dart: ^7.0.0-beta.1
  yaml: ^3.1.4

dev_dependencies:
  test: ^1.31.0
  lints: ^6.1.0
