name: ssgen_flutter
description: >-
  Live reload for SpriteStudio Player for Flutter: sswatch reconverts the
  projects you save in SpriteStudio and pushes them into the running app. A
  dev dependency.
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
documentation: https://cri-middleware.github.io/SSPlayerForFlutter/guide/live-reload/
topics:
  - spritestudio
  - hot-reload
  - developer-tools
  - cli
  - animation

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  ssplayer_flutter: ^7.0.0-beta.1
  ssgen_dart: ^7.0.0-beta.1
  watcher: ^1.2.1
  vm_service: ^15.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
