name: ssgen_flutter
description: >-
  Flutter dev-tooling for SpriteStudio live-reload. A State mixin (SsLiveReload)
  registers with an in-app VM-Service dev channel (SsDevChannel); the `sswatch`
  host runner watches SpriteStudio_Source, reconverts the stale projects
  (ssgen_dart -> host libssconverter) and pushes the fresh pack to the running
  app over the VM Service (ssplayer_flutter's reload) — no `r`, IDE-debugger
  friendly, desktop and device. DEV ONLY: add this only in apps that want in-app
  live-reload — the ssplayer_flutter runtime itself stays converter-free.
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
publish_to: none # not yet published to pub.dev

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  ssplayer_flutter: ^7.0.0-beta.1
  ssgen_dart: ^7.0.0-beta.1
  watcher: ^1.2.1
  vm_service: ^15.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
