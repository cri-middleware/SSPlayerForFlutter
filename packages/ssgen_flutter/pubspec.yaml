name: ssgen_flutter
description: >-
  Flutter dev-tooling for SpriteStudio live-reload. A State mixin (SsLiveReload)
  registers with an in-app VM-Service dev channel (SsDevChannel); the `sswatch`
  host runner watches SpriteStudio_Source, reconverts the stale projects
  (ssgen_dart -> host libssconverter) and pushes the fresh pack to the running
  app over the VM Service (ssplayer_flutter's reload) — no `r`, IDE-debugger
  friendly, desktop and device. DEV ONLY: add this only in apps that want in-app
  live-reload — the ssplayer_flutter runtime itself stays converter-free.
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
publish_to: none # not yet published to pub.dev

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # The player whose resource this hot-swaps (SpriteStudioPlayer.reload).
  # Hosted, not a path: pub refuses to publish a package with a path dependency,
  # and the repo-root pub workspace resolves both of these to the local members
  # anyway during dev (prerelease-inclusive caret, so 7.0.0-beta.1 satisfies it).
  ssplayer_flutter: ^7.0.0-beta.1
  # The host reconvert-stale orchestration (SsProjectSync). Desktop only; on
  # iOS/Android its ssconverter_dart dependency is mobile-inert (no code asset).
  ssgen_dart: ^7.0.0-beta.1
  # Filesystem watcher for the `sswatch` runner (watch SpriteStudio_Source →
  # reconvert + push). Host dev-tool only.
  watcher: ^1.1.0
  # VM Service client for the `sswatch` runner: connect to a running app's Dart
  # VM Service and call its `ext.ssgen.reload` extension to push a fresh pack —
  # no `flutter run` ownership, so it coexists with an IDE debug session.
  vm_service: ^15.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
