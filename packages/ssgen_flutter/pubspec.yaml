name: ssgen_flutter
description: >-
  Flutter dev-tooling for SpriteStudio live-reload. The `sswatch` host runner
  watches SpriteStudio_Source, reconverts the stale projects (ssgen_dart -> host
  libssconverter) and pushes the fresh pack over the VM Service into the running
  app, where ssplayer_flutter's channel reloads every player showing it — no
  `r`, no code in the app, IDE-debugger friendly, desktop and device. DEV ONLY:
  a dev_dependency — the ssplayer_flutter runtime itself stays converter-free.
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
publish_to: none # not yet published to pub.dev

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  ssplayer_flutter: ^7.0.0-beta.1
  ssgen_dart: ^7.0.0-beta.1
  watcher: ^1.2.1
  vm_service: ^15.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
