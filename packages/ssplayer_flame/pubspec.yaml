name: ssplayer_flame
description: >-
  Flame adapter for SpriteStudio Player for Flutter: a SpriteStudioComponent
  that plays a SpriteStudio animation (.ssab) inside a FlameGame.
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
documentation: https://cri-middleware.github.io/SSPlayerForFlutter/guide/flame/
topics:
  - spritestudio
  - flame
  - animation
  - game-development
  - game

# Declared for the same reason as in ssplayer_flutter's pubspec.yaml.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  ssplayer_flutter: ^7.0.0-beta.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
