include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Machine-generated: flatc FlatBuffers accessors and ffigen bindings.
    - lib/src/ssab/**
    - lib/src/bindings/*.g.dart
  errors:
    # The generated FlatBuffers/ffigen code trips a few lints; keep them quiet
    # here rather than editing generated output.
    unused_import: ignore

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: false
