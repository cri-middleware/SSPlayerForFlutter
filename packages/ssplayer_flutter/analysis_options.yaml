include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Machine-generated: flatc FlatBuffers .ssab/.ssqb accessors. (The ffigen
    # @Native bindings live in the ssruntime_dart package, not here.)
    - lib/src/ssab/**
    # Machine-generated too: the flatc write-side classes, split out of lib/ by
    # scripts/strip_fbs_builders.dart because only the tests build buffers.
    - test/support/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # The generated FlatBuffers code trips a few lints; keep them quiet here
    # rather than editing generated output.
    unused_import: ignore
    # The shader bundle the pubspec lists under build/shaderbundles/ is written
    # by hook/build.dart when the package is built, so a fresh checkout has
    # none. Reported, it fails `flutter analyze` here and the analysis inside
    # `dart pub publish --dry-run`, both of which run before anything builds it.
    asset_does_not_exist: ignore

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: false
    # RenderObjects here expose public named params (`player`/`width`/`height`)
    # backed by private fields (`_player` …); an initializing formal would rename
    # the param to the private field, breaking the public constructor API.
    prefer_initializing_formals: false
