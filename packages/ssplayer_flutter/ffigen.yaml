# ffigen configuration: generates the Layer 1 dart:ffi bindings from the C-API
# header produced by `cbindgen --lang c` (see scripts/generate-runtime-code.sh).
#
#   Input : native/include/ssruntime.h   (the SpriteStudio-SDK Brain C-API)
#   Output: lib/src/bindings/ssruntime_bindings.g.dart
#
# Regenerate with:  dart run ffigen --config ffigen.yaml
# (Until the Dart SDK is available, a hand-authored bootstrap subset lives in
#  the same output file and is overwritten on the first real ffigen run.)
name: SsRuntimeBindings
description: Low-level dart:ffi bindings for the SpriteStudio-SDK Brain (libssruntime).
output: "lib/src/bindings/ssruntime_bindings.g.dart"
headers:
  entry-points:
    - "native/include/ssruntime.h"
  include-directives:
    - "native/include/ssruntime.h"
functions:
  include:
    - "ss_.*"
structs:
  include:
    - "ss_.*"
    - "Ss.*"
enums:
  include:
    - "ss_.*"
    - "Ss.*"
typedefs:
  include:
    - "Ss.*"
comments:
  style: any
  length: full
preamble: |
  // GENERATED by ffigen (scripts/generate-runtime-code.sh). Do not edit by hand.
  // ignore_for_file: type=lint, unused_field, unused_element, camel_case_types, non_constant_identifier_names
