name: ssplayer_flutter
description: >-
  SpriteStudio Player for Flutter: plays SpriteStudio animations (.ssab) as a
  Flutter widget, on the Rust runtime every official SpriteStudio Player
  shares.
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
topics:
  - spritestudio
  - animation
  - widget
  - game-development
  - graphics

# Declared because pub.dev cannot detect them: flutter_gpu imports
# dart:nativewrappers, which pana's Flutter-native rules do not list, so the
# detected set would be Web alone.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  # Native assets (build hooks) are stable & default-on since Flutter 3.38 /
  # Dart 3.10, which is the floor the rest of this repo targets.
  #
  # This package alone sits a step higher, on flutter_gpu: 3.47 made
  # `ShaderLibrary.fromAsset` async (engine #187716) and moved the vertex/index
  # counts off the bind calls onto `draw`/`drawIndexed` (engine #187192). Both
  # are source-breaking and neither has a compatible spelling, so the GPU
  # backend cannot compile against 3.46 and earlier. flutter_gpu ships inside
  # the SDK and is unversioned, so this constraint is the only thing that can
  # express the requirement — keep the CI `flutter-version` pins on the same
  # side of it.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  vector_math: ^2.4.4
  flat_buffers: ^25.9.23
  ssruntime_dart: ^7.0.0-beta.1
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  hooks: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  material_ui: ^1.11.1

flutter:
  # NOT an FFI plugin: the native libssruntime is delivered by the ssruntime_dart
  # dependency via native assets (its hook/build.dart bundles the code asset), so
  # there is no vendored framework / podspec / platform glue here.

  # Web target: dart:ffi / native assets do not exist on the web, so the Brain is
  # delivered as the SDK's wasm-bindgen `web` build (SpriteStudio-SDK
  # release-web.sh → runtime-web) and driven from Dart over dart:js_interop. The
  # module is bundled as a plain Flutter asset and loaded at runtime.
  assets:
    # A DIRECTORY entry, NOT three individual files — on purpose. The wasm is
    # git-ignored and built on demand (scripts/build-runtime.sh platform=web). A
    # directory entry bundles whatever files are present and does NOT fail when
    # the wasm is absent, so a native-only checkout never needs the web runtime
    # built.
    - assets/runtime-web/
    # flutter_gpu shader bundle, compiled by hook/build.dart (impellerc) into
    # build/shaderbundles/ (gitignored, regenerated every build). Listed here so
    # the legacy shader-bundle delivery bundles it as a normal asset; loaded at
    # runtime via ShaderLibrary.fromAsset(
    # 'packages/ssplayer_flutter/build/shaderbundles/ssplayer.shaderbundle').
    # Only used by the flutter_gpu backend on Impeller; harmless elsewhere.
    - build/shaderbundles/ssplayer.shaderbundle

  # Fragment shaders, loaded lazily (only once a part actually needs one), so
  # animations that use neither PartColor nor masks nor an integration shader
  # pay nothing and keep the stock batched textured path. Consumers get them as
  # `packages/ssplayer_flutter/shaders/<name>.frag`.
  #   partcolor  — PartColor blend + mask replay, for peeled parts.
  #   mask_write — writes one mask writer's bit into the coverage bitmap.
  #   ss_*       — the 13 built-in integration shaders (`SHDR`), one program per
  #                effect so a shader impellerc rejects (a SILENT failure that
  #                falls back to the plain path) cannot take the others with it.
  #                They share shaders/ss_shader_common.glsl, which is #included
  #                rather than listed — it is not a program of its own. It and
  #                partcolor share shaders/part_fan.glsl the same way.
  shaders:
    - shaders/partcolor.frag
    - shaders/mask_write.frag
    - shaders/ss_sepia.frag
    - shaders/ss_hsb.frag
    - shaders/ss_step.frag
    - shaders/ss_pix.frag
    - shaders/ss_noise.frag
    - shaders/ss_bmask.frag
    - shaders/ss_outline.frag
    - shaders/ss_blur.frag
    - shaders/ss_wave.frag
    - shaders/ss_move.frag
    - shaders/ss_scatter.frag
    - shaders/ss_circle.frag
    - shaders/ss_spot.frag
