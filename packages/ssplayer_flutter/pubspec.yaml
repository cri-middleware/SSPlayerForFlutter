name: ssplayer_flutter
description: >-
  SpriteStudio 7 animation player for Flutter. A dart:ffi "Body" over the
  SpriteStudio-SDK Rust "Brain" (libssruntime): loads .ssab, drives playback,
  and renders DrawBatch plans with Canvas.drawVertices.
version: 0.1.0-dev.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
publish_to: none # not yet published to pub.dev

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  # Native assets (build hooks) are stable & default-on since Flutter 3.38 /
  # Dart 3.10 — the floor this package targets for the widest consumer base.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # dart:ffi helpers (Utf8, malloc/calloc, NativeFinalizer helpers).
  ffi: ^2.1.0
  # Dart FlatBuffers runtime used by the flatc-generated lib/src/ssab/*.g.dart.
  # Match the flatc used by scripts/generate-fbs-code.sh.
  flat_buffers: ^25.9.23
  # Layer 1: libssruntime dart:ffi `@Native` bindings via native assets (pure
  # Dart). Provides the runtime code asset (hook/build.dart) + FrameData FlatBuffers.
  ssruntime_dart:
    path: ../ssruntime_dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # NOT an FFI plugin: the native libssruntime is delivered by the ssruntime_dart
  # dependency via native assets (its hook/build.dart bundles the code asset), so
  # there is no vendored framework / podspec / platform glue here.

  # PartColor (§10) fragment shader. Consumers get it as
  # `packages/ssplayer_flutter/shaders/partcolor.frag`; the plugin loads it
  # lazily (only when a part actually carries a PartColor), so animations that
  # never use PartColor pay nothing and keep the stock textured path.
  shaders:
    - shaders/partcolor.frag
