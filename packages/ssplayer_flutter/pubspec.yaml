name: ssplayer_flutter
description: >-
  SpriteStudio 7 animation player for Flutter. A dart:ffi "Body" over the
  SpriteStudio-SDK Rust "Brain" (libssruntime): loads .ssab, drives playback,
  and renders DrawBatch plans with Canvas.drawVertices.
version: 7.0.0-alpha.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
publish_to: none # not yet published to pub.dev

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  # Native assets (build hooks) are stable & default-on since Flutter 3.38 /
  # Dart 3.10 — the floor this package targets for the widest consumer base.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # dart:ffi helpers (Utf8, malloc/calloc, NativeFinalizer helpers).
  ffi: ^2.1.0
  # Dart FlatBuffers runtime used by the flatc-generated lib/src/ssab/*.g.dart.
  # Match the flatc used by scripts/generate-fbs-code.sh.
  flat_buffers: ^25.9.23
  # Layer 1: libssruntime dart:ffi `@Native` bindings via native assets (pure
  # Dart). Provides the runtime code asset (hook/build.dart) + FrameData FlatBuffers.
  # Hosted for publish; the repo-root pub workspace resolves it to the local
  # member during dev (prerelease-inclusive caret so 7.0.0-alpha.1 satisfies it).
  # Publish ssruntime_dart to pub.dev before publishing this package.
  ssruntime_dart: ^7.0.0-alpha.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # NOT an FFI plugin: the native libssruntime is delivered by the ssruntime_dart
  # dependency via native assets (its hook/build.dart bundles the code asset), so
  # there is no vendored framework / podspec / platform glue here.

  # Web target: dart:ffi / native assets do not exist on the web, so the Brain is
  # delivered as the SDK's wasm-bindgen `web` build (SpriteStudio-SDK
  # release-web.sh → runtime-web) and driven from Dart over dart:js_interop. The
  # module is bundled as a plain Flutter asset and loaded at runtime; native
  # builds tree-shake these out (they only ship where dart.library.js_interop is).
  assets:
    - assets/runtime-web/ssruntime.js
    - assets/runtime-web/ssruntime_bg.wasm
    - assets/runtime-web/ssruntime_bg.nosimd.wasm

  # Fragment shaders, loaded lazily (only once a part actually needs one), so
  # animations that use neither PartColor nor masks pay nothing and keep the
  # stock batched textured path. Consumers get them as
  # `packages/ssplayer_flutter/shaders/<name>.frag`.
  #   partcolor  — PartColor (§10) blend + mask (§9) replay, for peeled parts.
  #   mask_write — writes one mask writer's bit into the coverage bitmap (§9).
  shaders:
    - shaders/partcolor.frag
    - shaders/mask_write.frag
