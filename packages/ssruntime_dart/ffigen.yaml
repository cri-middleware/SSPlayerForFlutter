# ffigen configuration: generates the Layer 1 dart:ffi bindings from the C-API
# header the SDK build.rs emits (native/include/ssruntime.h, copied in by
# build-runtime / download-sdk). No cbindgen here.
#
# Regenerate with:  scripts/generate-ffigen-code.sh  (globs packages/*/ffigen*.yaml;
# also invoked by build-runtime / download-sdk). The output is gitignored.
name: SsRuntimeBindings
description: Low-level dart:ffi bindings for the SpriteStudio-SDK Brain (libssruntime).
output: "lib/src/ssruntime_bindings.g.dart"
# Native assets: generate top-level `@Native(assetId: ...)` functions that resolve
# the code asset bundled by hook/build.dart (no DynamicLibrary). The asset id MUST
# match the hook's CodeAsset(package: 'ssruntime_dart', name: 'ssruntime').
ffi-native:
  asset-id: "package:ssruntime_dart/ssruntime"
headers:
  entry-points:
    - "native/include/ssruntime.h"
  include-directives:
    - "native/include/ssruntime.h"
functions:
  include:
    - "ss_.*"
structs:
  include:
    - "ss_.*"
    - "Ss.*"
enums:
  include:
    - "ss_.*"
    - "Ss.*"
typedefs:
  include:
    - "Ss.*"
comments:
  style: any
  length: full
preamble: |
  // GENERATED by ffigen (scripts/generate-ffigen-code.sh). Do not edit by hand.
  // ignore_for_file: type=lint, unused_field, unused_element, camel_case_types, non_constant_identifier_names
