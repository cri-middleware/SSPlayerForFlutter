name: ssruntime_dart
description: >-
  Pure-Dart dart:ffi `@Native` bindings for the SpriteStudio-SDK runtime
  (libssruntime): loads .ssab, advances time, and emits per-frame SoA buffers +
  DrawBatch plans. Layer 1 — the renderer-agnostic core beneath ssplayer_flutter
  (also usable from Flame / flutter_gpu / headless Dart). No Flutter dependency.
version: 7.0.0-dev.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
publish_to: none # not yet published to pub.dev

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  # Native assets (build hooks) are stable since Dart 3.10 (the hooks/code_assets
  # floor too) — target that for the widest consumer base.
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # Dart FlatBuffers runtime for the flatc-generated runtime accessors
  # (lib/src/fbs/framedata.g.dart, effect_draw_plan.g.dart).
  flat_buffers: ^25.9.23
  # Native-assets build hook (hook/build.dart): bundles the prebuilt libssruntime
  # as a code asset so @Native bindings resolve it (no DynamicLibrary / no Rust).
  # (Only dart:ffi is used in this package — package:ffi is not needed.)
  hooks: ^2.0.2
  code_assets: ^1.2.1

dev_dependencies:
  test: ^1.24.0
  lints: ^6.1.0
  # Regenerates lib/src/ssruntime_bindings.g.dart (committed) from
  # native/include/ssruntime.h. Run via scripts/generate-ffigen-code.sh
  # (standalone; after a C-API change, then commit).
  ffigen: ^20.1.1
