name: ssruntime_dart
description: >-
  dart:ffi bindings to the SpriteStudio runtime (libssruntime): loads .ssab
  and emits per-frame draw data. The renderer-agnostic core under
  ssplayer_flutter.
version: 7.0.0-beta.1
repository: https://github.com/cri-middleware/SSPlayerForFlutter
topics:
  - spritestudio
  - animation
  - ffi
  - rust
  - runtime

# Part of the repo-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

environment:
  # Native assets (build hooks) are stable since Dart 3.10 (the hooks/code_assets
  # floor too) — target that for the widest consumer base.
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flat_buffers: ^25.9.23
  ffi: ^2.2.0
  hooks: ^2.2.0
  code_assets: ^2.1.0
  archive: ^4.5.2
  crypto: ^3.0.8

dev_dependencies:
  test: ^1.31.1
  lints: ^6.1.0
  ffigen: ^23.0.0
